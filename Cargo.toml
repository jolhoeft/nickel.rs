[package]

name = "nickel"
version = "0.12.0"
authors = [ "Christoph Burgdorf <christoph@thoughtram.io>",
            "Kevin Butler <haqkrs@gmail.com>",
            "Simon Persson <simon@flaskpost.org>",
            "Jeff Olhoeft <jolhoeft@gmail.com>" ]
description = "An express.js inspired web framework"
license = "MIT"
edition = "2021"

homepage = "http://nickel-org.github.io/"
repository = "https://github.com/nickel-org/nickel.rs"
readme = "README.md"
keywords = ["nickel", "server", "web", "express"]
autoexamples = false

[dependencies]
groupable = "0.2"
lazy_static = "1.0"
log = "0.4"
modifier = "0.1"
mustache = "0.9"
plugin = "0.2"
regex = "1.0"
serde = "1.0"
serde_json = "1.0"
typemap = "0.3"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
bytes = "1"
mime = "0.3"
mime_guess = "2"
percent-encoding = "2"

[dev-dependencies]
serde_derive = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }

